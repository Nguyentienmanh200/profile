        async function downloadZip() {
            const pass = document.getElementById('adminPass').value.trim() || '123456';
            const zip = new JSZip();

            // 1. File .env
            zip.file(".env", `ADMIN_PASS=${pass}\n`);

            // 2. File .htaccess (Bảo mật khóa không cho người lạ xem file .env trên domain)
            zip.file(".htaccess", `<Files ".env">\n    Order allow,deny\n    Deny from all\n</Files>\n`);

            // 3. File api.php
            zip.file("api.php", document.getElementById('tpl-php').textContent.trim());

            // 4. File index.html
            zip.file("index.html", document.getElementById('tpl-html').textContent.trim());

            const content = await zip.generateAsync({ type: "blob" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(content);
            a.download = "liquid-profile-domain.zip";
            a.click();
        }
    </script>

    <script type="text/plain" id="tpl-php">
<?php
header('Content-Type: application/json; charset=utf-8');

function getAdminPass() {
    $envPath = __DIR__ . '/.env';
    if (!file_exists($envPath)) return '123456';
    $lines = file($envPath, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
    foreach ($lines as $line) {
        if (strpos(trim($line), '#') === 0) continue;
        $parts = explode('=', $line, 2);
        if (count($parts) === 2 && trim($parts[0]) === 'ADMIN_PASS') {
            return trim($parts[1]);
        }
    }
    return '123456';
}

$dataFile = __DIR__ . '/data.json';
$adminPass = getAdminPass();

if (!file_exists($dataFile)) {
    file_put_contents($dataFile, json_encode([
        'stats' => ['views' => 0, 'fb' => 0, 'tele' => 0, 'zalo' => 0]
    ], JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE));
}

$currentData = json_decode(file_get_contents($dataFile), true) ?: [];
if (!isset($currentData['stats'])) {
    $currentData['stats'] = ['views' => 0, 'fb' => 0, 'tele' => 0, 'zalo' => 0];
}

$rawInput = file_get_contents('php://input');
$body = json_decode($rawInput, true) ?: [];
$action = $_GET['action'] ?? ($body['action'] ?? ($_POST['action'] ?? ''));

if ($action === 'track') {
    $type = $body['type'] ?? 'views';
    if (in_array($type, ['views', 'fb', 'tele', 'zalo'])) {
        $currentData['stats'][$type] = ($currentData['stats'][$type] ?? 0) + 1;
        file_put_contents($dataFile, json_encode($currentData, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE), LOCK_EX);
    }
    echo json_encode(['success' => true, 'stats' => $currentData['stats']]);
    exit;
}

if ($action === 'login') {
    $pass = $body['password'] ?? '';
    if ($pass === $adminPass) {
        echo json_encode(['success' => true, 'data' => $currentData]);
    } else {
        echo json_encode(['success' => false]);
    }
    exit;
}

if ($action === 'upload') {
    $pass = $_POST['password'] ?? '';
    if ($pass !== $adminPass) {
        echo json_encode(['success' => false, 'error' => 'Unauthorized']);
        exit;
    }
    if (isset($_FILES['file']) && $_FILES['file']['error'] === UPLOAD_ERR_OK) {
        $uploadDir = __DIR__ . '/uploads/';
        if (!is_dir($uploadDir)) mkdir($uploadDir, 0755, true);
        
        $ext = strtolower(pathinfo($_FILES['file']['name'], PATHINFO_EXTENSION));
        $allowed = ['mp4', 'webm', 'mov', 'jpg', 'jpeg', 'png', 'gif', 'webp'];
        if (!in_array($ext, $allowed)) {
            echo json_encode(['success' => false, 'error' => 'Invalid file type']);
            exit;
        }

        $fileName = 'bg_' . time() . '_' . rand(100, 999) . '.' . $ext;
        $targetPath = $uploadDir . $fileName;
        
        if (move_uploaded_file($_FILES['file']['tmp_name'], $targetPath)) {
            echo json_encode(['success' => true, 'url' => 'uploads/' . $fileName]);
            exit;
        }
    }
    echo json_encode(['success' => false]);
    exit;
}

if ($action === 'save') {
    $pass = $body['password'] ?? '';
    if ($pass !== $adminPass) {
        echo json_encode(['success' => false, 'error' => 'Unauthorized']);
        exit;
    }
    $newData = $body['data'] ?? [];
    $newData['stats'] = $currentData['stats'];
    file_put_contents($dataFile, json_encode($newData, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE), LOCK_EX);
    echo json_encode(['success' => true]);
    exit;
}

echo json_encode(['success' => false]);
    </script>

            avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80',
            name: 'ALEX NGUYỄN',
            bio: '⚡ Full-stack Creator • Liquid UI Architect ⚡',
            fb: 'https://facebook.com',
            tele: 'https://t.me',
            zalo: 'https://zalo.me',
            sections: [
                { title: '💎 Không Gian Pha Lê Lỏng', content: 'Giao diện trong suốt 100% với hiệu ứng vật lý đàn hồi.\nKhi bạn giữ và kéo nút, trang sẽ đứng im tuyệt đối để bạn cảm nhận độ nảy!' },
                { title: '🚀 Kỹ Năng Chuyên Môn', content: '• Thiết kế trải nghiệm tương tác vật lý 60FPS\n• Phát triển hệ thống Web Full-stack thời gian thực\n• Tối ưu hóa đa phương tiện & Tự động hóa API' }
            ],
            stats: { views: 1, fb: 0, tele: 0, zalo: 0 }
        };

        let appData = defaultData;
        let sessionAdminPass = '';
        let activeVideoEl = null;
        let isSoundMuted = false;

        function showToast(msg, duration = 3500) {
            const t = document.getElementById('status-toast');
            t.innerText = msg;
            t.style.display = 'block';
            clearTimeout(t.timer);
            t.timer = setTimeout(() => { t.style.display = 'none'; }, duration);
        }

        async function callServer(action, payload = {}, isFormData = false) {
            try {
                const opts = { method: 'POST' };
                if (isFormData) {
                    opts.body = payload;
                } else {
                    opts.headers = { 'Content-Type': 'application/json' };
                    opts.body = JSON.stringify({ action, ...payload });
                }
                const res = await fetch(`api.php?action=${action}`, opts);
                if (res.ok) return await res.json();
            } catch (e) {}
            return null;
        }

        async function initApp() {
            try {
                const res = await fetch(`data.json?t=${Date.now()}`);
                if (res.ok) {
                    const serverData = await res.json();
                    if (serverData && serverData.name) {
                        appData = { ...defaultData, ...serverData, stats: { ...defaultData.stats, ...(serverData.stats || {}) } };
                    }
                }
            } catch (e) {}

            renderUI();
            await renderBackground();

            const trackRes = await callServer('track', { type: 'views' });
            if (trackRes && trackRes.stats) appData.stats = trackRes.stats;
        }

        async function renderBackground() {
            const container = document.getElementById('bg-container');
            let url = (appData.bgLink || '').trim();
            if (!url) return;

            if (url.includes('tiktok.com')) {
                showToast('⏳ Đang kết nối nguồn phát TikTok có âm thanh...');
                try {
                    const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                    const json = await res.json();
                    if (json && json.data && json.data.play) {
                        mountSmartVideo(container, json.data.play);
                        return;
                    }
                } catch (e) {}
            }

            const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const ytMatch = url.match(ytRegex);
            if (ytMatch && ytMatch[1]) {
                const vid = ytMatch[1];
                container.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=0&controls=0&loop=1&playlist=${vid}&playsinline=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                updateSoundUI(true);
                return;
            }

            if (/\.(jpg|jpeg|png|gif|webp|bmp|svg)(\?.*)?$/i.test(url)) {
                container.innerHTML = `<img src="${url}" referrerpolicy="no-referrer" alt="Background">`;
                document.getElementById('sound-toggle').style.display = 'none';
                return;
            }

            mountSmartVideo(container, url);
        }

        function mountSmartVideo(container, srcUrl) {
            document.getElementById('sound-toggle').style.display = 'flex';
            container.innerHTML = '';
            const video = document.createElement('video');
            video.src = srcUrl;
            video.loop = true;
            video.playsInline = true;
            video.volume = 1.0;
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.setAttribute('referrerpolicy', 'no-referrer');
            container.appendChild(video);
            activeVideoEl = video;

            video.muted = false;
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isSoundMuted = false;
                    updateSoundUI(true);
                }).catch(() => {
                    video.muted = true;
                    isSoundMuted = true;
                    video.play().catch(() => {});
                    updateSoundUI(false);

                    const unlockAudio = () => {
                        if (activeVideoEl && isSoundMuted) {
                            activeVideoEl.muted = false;
                            activeVideoEl.volume = 1.0;
                            activeVideoEl.play().catch(() => {});
                            isSoundMuted = false;
                            updateSoundUI(true);
                        }
                        window.removeEventListener('pointerdown', unlockAudio);
                        window.removeEventListener('keydown', unlockAudio);
                    };
                    window.addEventListener('pointerdown', unlockAudio, { once: true });
                    window.addEventListener('keydown', unlockAudio, { once: true });
                });
            }
        }

        function toggleSound() {
            if (!activeVideoEl) return;
            isSoundMuted = !isSoundMuted;
            activeVideoEl.muted = isSoundMuted;
            if (!isSoundMuted) activeVideoEl.play().catch(() => {});
            updateSoundUI(!isSoundMuted);
        }

        function updateSoundUI(isPlayingSound) {
            const pill = document.getElementById('sound-toggle');
            const txt = document.getElementById('sound-text');
            if (isPlayingSound) {
                pill.classList.add('playing');
                txt.innerText = 'Âm Thanh: BẬT';
            } else {
                pill.classList.remove('playing');
                txt.innerText = 'Chạm Để Bật Tiếng';
            }
        }

        function renderUI() {
            document.getElementById('ui-avatar').src = appData.avatar;
            document.getElementById('ui-name').innerText = appData.name;
            document.getElementById('ui-bio').innerText = appData.bio;
            document.getElementById('ui-fb').href = appData.fb;
            document.getElementById('ui-tele').href = appData.tele;
            document.getElementById('ui-zalo').href = appData.zalo;

            const grid = document.getElementById('ui-widgets-grid');
            grid.innerHTML = '';
            (appData.sections || []).forEach((sec) => {
                const card = document.createElement('div');
                card.className = 'liquid-widget elastic';
                card.innerHTML = `<div class="widget-title">${sec.title}</div><div class="widget-content">${sec.content}</div>`;
                grid.appendChild(card);
            });

            initSpringPhysics();
        }

        function initSpringPhysics() {
            const elements = document.querySelectorAll('.elastic');
            elements.forEach(el => {
                if (el.dataset.boundPhysics) return;
                el.dataset.boundPhysics = 'true';

                let isDragging = false, startX = 0, startY = 0, movedDistance = 0;

                const onStart = (e) => {
                    isDragging = true;
                    movedDistance = 0;
                    el.style.transition = 'none';
                    document.body.classList.add('lock-scroll');
                    const pt = e.touches ? e.touches[0] : e;
                    startX = pt.clientX; startY = pt.clientY;
                };

                const onMove = (e) => {
                    if (!isDragging) return;
                    if (e.cancelable) e.preventDefault();
                    const pt = e.touches ? e.touches[0] : e;
                    const dx = pt.clientX - startX;
                    const dy = pt.clientY - startY;
                    movedDistance = Math.hypot(dx, dy);

                    const maxPull = 60;
                    const pull = Math.min(movedDistance * 0.48, maxPull);
                    const angle = Math.atan2(dy, dx);
                    const tx = Math.cos(angle) * pull;
                    const ty = Math.sin(angle) * pull;
                    const stretch = 1 + (pull / maxPull) * 0.16;
                    const squash = 1 - (pull / maxPull) * 0.07;
                    const rotate = dx * 0.045;

                    el.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${rotate}deg) scale(${stretch}, ${squash})`;
                };

                const onEnd = () => {
                    if (!isDragging) return;
                    isDragging = false;
                    document.body.classList.remove('lock-scroll');
                    el.style.transition = 'transform 0.85s cubic-bezier(0.68, -0.6, 0.265, 1.65)';
                    el.style.transform = 'translate3d(0px, 0px, 0) rotate(0deg) scale(1, 1)';
                };

                el.addEventListener('click', async (e) => {
                    if (movedDistance > 12) { e.preventDefault(); return; }
                    const platform = el.dataset.platform;
                    if (platform) {
                        const res = await callServer('track', { type: platform });
                        if (res && res.stats) appData.stats = res.stats;
                    }
                });

                el.addEventListener('mousedown', onStart);
                window.addEventListener('mousemove', onMove, { passive: false });
                window.addEventListener('mouseup', onEnd);
                el.addEventListener('touchstart', onStart, { passive: false });
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('touchend', onEnd);
                window.addEventListener('touchcancel', onEnd);
            });
        }

        function requestAdminAccess() {
            if (sessionAdminPass) openAdminModal();
            else {
                document.getElementById('input-admin-pass').value = '';
                document.getElementById('login-modal').style.display = 'flex';
                document.getElementById('input-admin-pass').focus();
            }
        }

        async function verifyLogin() {
            const pass = document.getElementById('input-admin-pass').value.trim();
            if (!pass) return;
            const res = await callServer('login', { password: pass });
            if (res && res.success) {
                sessionAdminPass = pass;
                if (res.data && res.data.name) appData = res.data;
                else if (res.data && res.data.stats) appData.stats = res.data.stats;
                document.getElementById('login-modal').style.display = 'none';
                openAdminModal();
                showToast('🔓 Đăng nhập Admin thành công!');
            } else {
                showToast('❌ Sai mật khẩu trong file .env!');
            }
        }

        function openAdminModal() {
            const st = appData.stats || { views: 0, fb: 0, tele: 0, zalo: 0 };
            document.getElementById('stat-views').innerText = st.views || 0;
            document.getElementById('stat-fb').innerText = st.fb || 0;
            document.getElementById('stat-tele').innerText = st.tele || 0;
            document.getElementById('stat-zalo').innerText = st.zalo || 0;

            document.getElementById('input-bg').value = appData.bgLink || '';
            document.getElementById('input-avatar').value = appData.avatar || '';
            document.getElementById('input-name').value = appData.name || '';
            document.getElementById('input-bio').value = appData.bio || '';
            document.getElementById('input-fb').value = appData.fb || '';
            document.getElementById('input-tele').value = appData.tele || '';
            document.getElementById('input-zalo').value = appData.zalo || '';

            renderAdminSections();
            document.getElementById('admin-panel').style.display = 'flex';
        }

        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }

        function renderAdminSections() {
            const list = document.getElementById('admin-sections-list');
            list.innerHTML = '';
            (appData.sections || []).forEach((sec, idx) => {
                const item = document.createElement('div');
                item.className = 'section-item-admin';
                item.innerHTML = `
                    <button type="button" class="btn-remove-sec" onclick="removeSectionAdmin(${idx})">Xóa mục</button>
                    <input type="text" class="sec-title-inp" value="${sec.title}" placeholder="Tiêu đề mục...">
                    <textarea class="sec-content-inp" rows="2" placeholder="Nội dung mục...">${sec.content}</textarea>
                `;
                list.appendChild(item);
            });
        }

        function addSectionAdmin() {
            syncAdminSectionsFromDOM();
            appData.sections.push({ title: '✨ Mục Mới', content: 'Nội dung mục mới...' });
            renderAdminSections();
        }

        function removeSectionAdmin(index) {
            syncAdminSectionsFromDOM();
            appData.sections.splice(index, 1);
            renderAdminSections();
        }

        function syncAdminSectionsFromDOM() {
            const titles = document.querySelectorAll('.sec-title-inp');
            const contents = document.querySelectorAll('.sec-content-inp');
            const updated = [];
            titles.forEach((t, i) => updated.push({ title: t.value, content: contents[i].value }));
            appData.sections = updated;
        }

        document.getElementById('input-upload-file').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            showToast('⏳ Đang tải file lên Domain...');
            const formData = new FormData();
            formData.append('action', 'upload');
            formData.append('password', sessionAdminPass);
            formData.append('file', file);

            const res = await callServer('upload', formData, true);
            if (res && res.success && res.url) {
                document.getElementById('input-bg').value = res.url;
                document.getElementById('upload-status').innerText = `✅ Đã tải lên Domain: ${res.url}`;
                showToast('✅ Tải file lên thành công!');
            } else {
                showToast('❌ Lỗi tải file (Kiểm tra dung lượng upload_max_filesize trên Host).');
            }
        });

        async function saveDataToServer() {
            syncAdminSectionsFromDOM();
            appData.bgLink = document.getElementById('input-bg').value.trim();
            appData.avatar = document.getElementById('input-avatar').value.trim();
            appData.name = document.getElementById('input-name').value;
            appData.bio = document.getElementById('input-bio').value;
            appData.fb = document.getElementById('input-fb').value.trim();
            appData.tele = document.getElementById('input-tele').value.trim();
            appData.zalo = document.getElementById('input-zalo').value.trim();

            const res = await callServer('save', { password: sessionAdminPass, data: appData });
            if (res && res.success) {
                showToast('✅ Đã lưu vào data.json trên Domain! Mọi người truy cập đều sẽ thấy.');
            } else {
                showToast('⚠️ Không thể ghi file data.json (Hãy kiểm tra quyền ghi CHMOD 755 trên Host).');
            }
            renderUI();
            await renderBackground();
            closeAdmin();
        }

        document.getElementById('avatar-trigger').addEventListener('dblclick', requestAdminAccess);
        initApp();
    </script>
</body>
